[build-system]
requires = [
    "setuptools>=77",
    "cython",
    "tomli; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "bfsccylinder"
version = "0.7.0"
description = "Implementation of the BFSC cylinder finite element"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Saullo G. P. Castro", email = "S.G.P.Castro@tudelft.nl" },
]
keywords = [
    "finite elements", "plate", "shell", "cylindrical shell", "static analysis",
    "buckling", "vibration", "structural dynamics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: POSIX :: BSD",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
    "composites",
]

[project.urls]
Homepage = "https://github.com/saullocastro/bfsccylinder"
Repository = "https://github.com/saullocastro/bfsccylinder"

[tool.setuptools.packages.find]
include = ["bfsccylinder*"]

[tool.setuptools.package-data]
bfsccylinder = ["*.pxd", "*.pyx"]
